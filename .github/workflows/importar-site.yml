name: Importar versão publicada do Observatório

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/importar-site.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Importar versão publicada
        shell: bash
        run: |
          set -euo pipefail
          SITE="https://observatorio-territorio-luanna.luanna-silva-139.chatgpt.site/"
          HOST="observatorio-territorio-luanna.luanna-silva-139.chatgpt.site"

          rm -rf _mirror
          mkdir -p _mirror

          wget \
            --mirror \
            --page-requisites \
            --convert-links \
            --adjust-extension \
            --no-parent \
            --directory-prefix="_mirror" \
            "$SITE"

          SRC="_mirror/$HOST"
          test -f "$SRC/index.html"

          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            ! -name "_mirror" \
            ! -name "README.md" \
            -exec rm -rf {} +

          cp -a "$SRC"/. .
          rm -rf _mirror
          touch .nojekyll

      - name: Salvar versão no GitHub
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nenhuma alteração encontrada."
            exit 0
          fi
          git commit -m "Importa última versão publicada do Observatório"
          git push
